name: ROLL CAY CANH iOS Build

on:
  workflow_dispatch:
    inputs:
      signed_ipa:
        description: 'Export a signed IPA (requires Apple signing secrets configured)'
        required: true
        default: false
        type: boolean
  push:
    branches: ["ios-release"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      IOS_BUNDLE_ID: vn.rollgardencanh.app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        
      - name: Restore missing Android test paths
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reference/app/src/main/assets
          cp web/index.html reference/app/src/main/assets/index.html
          cp web/tiktok-label-import.js reference/app/src/main/assets/tiktok-label-import.js
          test -s reference/app/src/main/assets/index.html
          test -s reference/app/src/main/assets/tiktok-label-import.js
          echo "Compatibility paths restored."

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm install
      - name: Run source and regression validation
        run: npm run validate
      - name: Generate Capacitor iOS project
        run: npx cap add ios
      - name: Install native plugin and iOS permissions
        run: npm run ios:prepare
      - name: Install Xcode project editor
        run: gem install xcodeproj --no-document
      - name: Register native plugin in Xcode build target
        run: ruby scripts/register-ios-plugin.rb
      - name: Sync Capacitor iOS assets
        run: npx cap sync ios
      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package Simulator build for QA
        run: |
          mkdir -p artifacts
          APP_PATH="$(find build/DerivedData/Build/Products -maxdepth 2 -name 'App.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/ROLL-CAY-CANH-iOS-Simulator.zip
      - name: Upload Simulator QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: roll-cay-canh-ios-simulator
          path: artifacts/ROLL-CAY-CANH-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Validate signing secrets are present
        if: ${{ inputs.signed_ipa }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          test -n "$IOS_CERTIFICATE_BASE64" || (echo 'Missing IOS_CERTIFICATE_BASE64 secret' && exit 1)
          test -n "$IOS_CERTIFICATE_PASSWORD" || (echo 'Missing IOS_CERTIFICATE_PASSWORD secret' && exit 1)
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || (echo 'Missing IOS_PROVISIONING_PROFILE_BASE64 secret' && exit 1)
          test -n "$IOS_TEAM_ID" || (echo 'Missing IOS_TEAM_ID secret' && exit 1)

      - name: Import Apple distribution certificate and profile
        if: ${{ inputs.signed_ipa }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/roll-ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        if: ${{ inputs.signed_ipa }}
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ROLL-CAY-CANH.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGNING_ALLOWED=YES

      - name: Export signed IPA
        if: ${{ inputs.signed_ipa }}
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$IOS_BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ROLL-CAY-CANH.xcarchive \
            -exportPath artifacts/ipa \
            -exportOptionsPlist build/ExportOptions.plist
          test -n "$(find artifacts/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
      - name: Upload signed IPA
        if: ${{ inputs.signed_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: roll-cay-canh-ios-ipa
          path: artifacts/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
